# This playbook is used by the .github/workflows/ee.yml
# workflow for EE configuration validation
- name: Validate ansible.mariadb EE
  hosts: localhost
  gather_facts: false
  tasks:

   - name: Verify pymysql is importable
     ansible.builtin.command: python3 -c "import pymysql; print(pymysql.__version__)"
     changed_when: false
     register: _pymysql

   - name: Verify ansible.mariadb collection is installed
     ansible.builtin.command: ansible-galaxy collection list ansible.mariadb
     changed_when: false
     register: _collection

   - name: Verify ansible.mariadb.mariadb_info module is documented
     ansible.builtin.command: ansible-doc ansible.mariadb.mariadb_info
     changed_when: false

   - name: Print results
     ansible.builtin.debug:
       msg:
        - "pymysql version: {{ _pymysql.stdout }}"
        - "{{ _collection.stdout }}"
