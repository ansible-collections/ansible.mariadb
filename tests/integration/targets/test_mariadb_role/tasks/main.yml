####################################################################
# WARNING: These are designed specifically for Ansible tests       #
# and should not be used as examples of how to write Ansible roles #
####################################################################

# mysql_role module initial CI tests

# mariadb_role_initial.yml is disabled as there are issues running on
# MariaDB hosts. TODO: fix issues with tests and remove 'when' clause.
- include_tasks: mariadb_role_initial.yml
  when:
    - db_engine != 'mariadb'

- include_tasks: test_sql_log_bin.yml

# Test that subtract_privs will only revoke the grants given by priv
# (https://github.com/ansible-collections/ansible.mysql/issues/331)
- include_tasks: test_priv_subtract.yml
  vars:
    enable_check_mode: no
- include_tasks: test_priv_subtract.yml
  vars:
    enable_check_mode: yes

- name: Test column case sensitive
  ansible.builtin.import_tasks:
    file: test_column_case_sensitive.yml
