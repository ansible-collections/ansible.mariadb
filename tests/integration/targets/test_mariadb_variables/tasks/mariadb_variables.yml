# ============================================================
# Verify mariadb_variable successfully queries a variable
#
- vars:
    mariadb_parameters: &mariadb_params
      login_user: '{{ mariadb_user }}'
      login_password: '{{ mariadb_password }}'
      login_host: '{{ mariadb_host }}'
      login_port: '{{ mariadb_primary_port }}'

  block:

    - set_fact:
        set_name: 'version'

    - name: read mysql variables (expect changed=false)
      mariadb_variables:
        <<: *mariadb_params
        variable: '{{ set_name }}'
      register: result

    - include_tasks: assert_var_output.yml
      vars:
        changed: false
        output: "{{ result }}"
        var_name: "{{ set_name }}"

    # ============================================================
    # Verify mariadb_variable successfully updates a variable (issue:4568)
    #
    - set_fact:
        set_name: 'delay_key_write'
        set_value: 'ON'

    - name: set mysql variable
      mariadb_variables:
        <<: *mariadb_params
        variable: '{{ set_name }}'
        value: '{{ set_value }}'

    - name: update mysql variable to same value (expect changed=false)
      mariadb_variables:
        <<: *mariadb_params
        variable: '{{ set_name }}'
        value: '{{ set_value }}'
      register: result

    - include_tasks: assert_var.yml
      vars:
        changed: false
        output: "{{ result }}"
        var_name: "{{ set_name }}"
        var_value: "{{ set_value }}"

    # ============================================================
    # Verify mariadb_variable successfully updates a variable using single quotes
    #
    - set_fact:
        set_name: 'wait_timeout'
        set_value: '300'

    - name: set mysql variable to a temp value
      mariadb_variables:
        <<: *mariadb_params
        variable: '{{ set_name }}'
        value: '200'

    - name: update mysql variable value (expect changed=true)
      mariadb_variables:
        <<: *mariadb_params
        variable: '{{ set_name }}'
        value: '{{ set_value }}'
      register: result

    - assert:
        that:
        - result.queries == expected_queries
      vars:
        expected_queries: ["SET GLOBAL `{{ set_name }}` = {{ set_value }}"]

    - include_tasks: assert_var.yml
      vars:
        changed: true
        output: "{{ result }}"
        var_name: "{{ set_name }}"
        var_value: '{{ set_value }}'

    # ============================================================
    # Verify mariadb_variable successfully updates a variable using double quotes
    #
    - set_fact:
        set_name: "wait_timeout"
        set_value: "400"

    - name: set mysql variable to a temp value
      mariadb_variables:
        <<: *mariadb_params
        variable: '{{ set_name }}'
        value: "200"

    - name: update mysql variable value (expect changed=true)
      mariadb_variables:
        <<: *mariadb_params
        variable: '{{ set_name }}'
        value: '{{ set_value }}'
      register: result

    - include_tasks: assert_var.yml
      vars:
        changed: true
        output: "{{ result }}"
        var_name: "{{ set_name }}"
        var_value: '{{ set_value }}'

    # ============================================================
    # Verify mariadb_variable successfully updates a variable using no quotes
    #
    - set_fact:
        set_name: wait_timeout
        set_value: 500

    - name: set mysql variable to a temp value
      mariadb_variables:
        <<: *mariadb_params
        variable: '{{ set_name }}'
        value: 200

    - name: update mysql variable value (expect changed=true)
      mariadb_variables:
        <<: *mariadb_params
        variable: '{{ set_name }}'
        value: '{{ set_value }}'
      register: result

    - include_tasks: assert_var.yml
      vars:
        changed: true
        output: "{{ result }}"
        var_name: "{{ set_name }}"
        var_value: '{{ set_value }}'

    # ============================================================
    # Verify mariadb_variable successfully updates a variable using an expression (e.g. 1024*4)
    #
    - name: set mysql variable value to an expression
      mariadb_variables:
        <<: *mariadb_params
        variable: max_connect_errors
        value: "1024*4"
      register: result
      ignore_errors: true

    - include_tasks: assert_fail_msg.yml
      vars:
        output: "{{ result }}"
        msg: 'Incorrect argument type to variable'

    # ============================================================
    # Verify mariadb_variable fails when setting an incorrect value (out of range)
    #
    - name: Set mysql variable value to a number out of range
      mariadb_variables:
        <<: *mariadb_params
        variable: max_connect_errors
        value: '-1'
      register: oor_result
      ignore_errors: true

    - include_tasks: assert_fail_msg.yml
      vars:
        output: "{{ oor_result }}"
        msg: 'Truncated incorrect'
      when:
        - connector_name == 'pymsql'

    # ============================================================
    # Verify mariadb_variable fails when setting an incorrect value (incorrect type)
    #
    - name: set mysql variable value to a non-valid value number
      mariadb_variables:
        <<: *mariadb_params
        variable: max_connect_errors
        value: TEST
      register: nvv_result
      ignore_errors: true

    - include_tasks: assert_fail_msg.yml
      vars:
        output: "{{ nvv_result }}"
        msg: 'Incorrect argument type to variable'

    # ============================================================
    # Verify mariadb_variable fails when setting an unknown variable
    #
    - name: set a non mysql variable
      mariadb_variables:
        <<: *mariadb_params
        variable: my_sql_variable
        value: ON
      register: result
      ignore_errors: true

    - include_tasks: assert_fail_msg.yml
      vars:
        output: "{{ result }}"
        msg: 'Variable not available'

    # ============================================================
    # Verify mariadb_variable fails when setting a read-only variable
    #
    - name: set value of a read only mysql variable
      mariadb_variables:
        <<: *mariadb_params
        variable: character_set_system
        value: utf16
      register: result
      ignore_errors: true

    - include_tasks: assert_fail_msg.yml
      vars:
        output: "{{ result }}"
        msg: 'read only variable'

    #=============================================================
    # Verify mariadb_variable works with the login_user and login_password parameters
    #
    - set_fact:
        set_name: wait_timeout
        set_value: 77

    - name: query mariadb_variable using login_user and password_password
      mariadb_variables:
        <<: *mariadb_params
        variable: '{{ set_name }}'
      register: result

    - include_tasks: assert_var_output.yml
      vars:
        changed: false
        output: "{{ result }}"
        var_name: "{{ set_name }}"

    - name: set mysql variable to temp value using user login and password (expect changed=true)
      mariadb_variables:
        <<: *mariadb_params
        variable: '{{ set_name }}'
        value: 20
      register: result

    - name: update mysql variable value using user login and password (expect changed=true)
      mariadb_variables:
        <<: *mariadb_params
        variable: '{{set_name}}'
        value: '{{set_value}}'
      register: result

    - include_tasks: assert_var.yml
      vars:
        changed: true
        output: "{{result}}"
        var_name: "{{set_name}}"
        var_value: '{{set_value}}'

    #=========================================================================
    # Bugfix https://github.com/ansible-collections/ansible.mysql/issues/652

    - name: Get server version
      mariadb_info:
        <<: *mariadb_params
      register: result

    - name: Set variable name
      set_fact:
        log_slow_statements: log_slow_slave_statements
      when: result.server_engine == 'MariaDB'

    - name: Set a boolean value using ON
      mariadb_variables:
        <<: *mariadb_params
        variable: "{{ log_slow_statements }}"
        value: "ON"
      register: result

    - name: Check that it changed
      assert:
        that:
        - result is changed or result.msg == "Variable is already set to requested value."
        - result.msg == "Variable is already set to requested value." or result.queries == expected_queries
      vars:
        expected_queries: ["SET GLOBAL `{{ log_slow_statements }}` = ON"]

    - name: Set a boolean value again using ON
      mariadb_variables:
        <<: *mariadb_params
        variable: "{{ log_slow_statements }}"
        value: "ON"
      register: result

    - name: Check that it didn't change
      assert:
        that:
        - result is not changed

    - name: Set a boolean value again using 1
      mariadb_variables:
        <<: *mariadb_params
        variable: "{{ log_slow_statements }}"
        value: 1
      register: result

    - name: Check that it didn't change
      assert:
        that:
        - result is not changed

    - name: Set a boolean value using OFF
      mariadb_variables:
        <<: *mariadb_params
        variable: "{{ log_slow_statements }}"
        value: "OFF"
      register: result

    - name: Check that it changed
      assert:
        that:
        - result is changed
        - result.queries == ["SET GLOBAL `{{ log_slow_statements }}` = OFF"]

    - name: Set a boolean value again using 0
      mariadb_variables:
        <<: *mariadb_params
        variable: "{{ log_slow_statements }}"
        value: 0
      register: result

    - name: Check that it didn't change
      assert:
        that:
        - result is not changed

    - name: Set a boolean value using on
      mariadb_variables:
        <<: *mariadb_params
        variable: "{{ log_slow_statements }}"
        value: "on"
      register: result

    - name: Check that it changed
      assert:
        that:
        - result is changed
        - result.queries == expected_queries
      vars:
        expected_queries: ["SET GLOBAL `{{ log_slow_statements }}` = ON"]

    #============================================================
    # Verify mariadb_variable fails with an incorrect login_password parameter
    #
    - set_fact:
        set_name: connect_timeout
        set_value: 10

    - name: query mariadb_variable using incorrect login_password
      mariadb_variables:
        login_user: '{{ mariadb_user }}'
        login_password: 'wrongpassword'
        login_host: '{{ mariadb_host }}'
        login_port: '{{ mariadb_primary_port }}'
        variable: '{{ set_name }}'
      register: result
      ignore_errors: true

    - include_tasks: assert_fail_msg.yml
      vars:
        output: "{{ result }}"
        msg: 'unable to connect to database'

    - name: update variable value using incorrect login_password (expect failed=true)
      mariadb_variables:
        login_user: '{{ mariadb_user }}'
        login_password: 'wrongpassword'
        login_host: '{{ mariadb_host }}'
        login_port: '{{ mariadb_primary_port }}'
        variable: '{{ set_name }}'
        value: '{{ set_value }}'
      register: result
      ignore_errors: true

    - include_tasks: assert_fail_msg.yml
      vars:
        output: "{{ result }}"
        msg: 'unable to connect to database'

    #============================================================
    # Verify mariadb_variable fails with an incorrect login_host parameter
    #
    - name: query mariadb_variable using incorrect login_host
      mariadb_variables:
        login_user: '{{ mariadb_user }}'
        login_password: '{{ mariadb_password }}'
        login_host: '12.0.0.9'
        login_port: '{{ mariadb_primary_port }}'
        variable: wait_timeout
        connect_timeout: 5
      register: result
      ignore_errors: true

    - include_tasks: assert_fail_msg.yml
      vars:
        output: "{{ result }}"
        msg: 'unable to connect to database'

