---

- vars:
    mariadb_parameters: &mariadb_params
      login_user: '{{ mariadb_user }}'
      login_password: '{{ mariadb_password }}'
      login_host: '{{ mariadb_host }}'
      login_port: '{{ mariadb_primary_port }}'
  block:

    - name: Disable ssl verification
      ansible.mariadb.mariadb_replication:
        <<: *mariadb_params
        login_port: '{{ mariadb_replica1_port }}'
        mode: changeprimary
        primary_ssl_verify_server_cert: false
      register: result

    - name: Assert that changeprimmary is changed and return expected query
      ansible.builtin.assert:
        that:
          - result is changed
          - result.queries == expected_queries
      vars:
        expected_queries: ["CHANGE MASTER TO MASTER_SSL_VERIFY_SERVER_CERT=0"]
