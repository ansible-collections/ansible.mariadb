---
- vars:
    mariadb_parameters: &mariadb_params
      login_user: '{{ mariadb_user }}'
      login_password: '{{ mariadb_password }}'
      login_host: '{{ mariadb_host }}'
      login_port: '{{ mariadb_primary_port }}'

  block:

    - name: Issue-64560 | Set root password
      mariadb_user:
        <<: *mariadb_params
        name: root
        host: '%'
        password: '{{ root_password }}'
        check_implicit_admin: yes
      register: result

    - name: Issue-64560 | Assert root password is changed
      assert:
        that:
          - result is changed

    - name: Issue-64560 | Set root password again
      mariadb_user:
        login_user: '{{ mariadb_user }}'
        login_password: '{{ root_password }}'
        login_host: '{{ mariadb_host }}'
        login_port: '{{ mariadb_primary_port }}'
        name: root
        host: '%'
        password: '{{ root_password }}'
        check_implicit_admin: yes
      register: result

    - name: Issue-64560 | Assert root password is not changed
      assert:
        that:
          - result is not changed

    - name: Issue-64560 | Set root password again
      mariadb_user:
        login_user: '{{ mariadb_user }}'
        login_password: '{{ root_password }}'
        login_host: '{{ mariadb_host }}'
        login_port: '{{ mariadb_primary_port }}'
        name: root
        host: '%'
        password: '{{ mariadb_password }}'
        check_implicit_admin: yes
      register: result
