---
# test code for privileges for mariadb_user module - issue 465

- vars:
    mariadb_parameters: &mariadb_params
      login_user: '{{ mariadb_user }}'
      login_password: '{{ mariadb_password }}'
      login_host: '{{ mariadb_host }}'
      login_port: '{{ mariadb_primary_port }}'

  block:

    # ============================================================
    - name: Privs issue 465 | Create a user with parameters that will always cause an exception
      mariadb_user:
        <<: *mariadb_params
        name: user_issue_465
        password: a_test_password_465
        priv: '*.{{ db_name }}:SELECT'
        state: present
      ignore_errors: true
      register: result

    - name: Privs issue 465 | Assert output message for current privileges
      assert:
        that:
          - result is failed
          - result.msg is search('invalid priv string')
          - result.msg is search('params')
          - result.msg is search('query')
          - result.msg is search('exception')
