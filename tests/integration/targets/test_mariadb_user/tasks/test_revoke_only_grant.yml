---
- vars:
    mariadb_parameters: &mariadb_params
      login_user: '{{ mariadb_user }}'
      login_password: '{{ mariadb_password }}'
      login_host: '{{ mariadb_host }}'
      login_port: '{{ mariadb_primary_port }}'
  block:
    - include_tasks: utils/remove_user.yml
      vars:
        user_name: "{{ user_name_1 }}"

    - name: Revoke only grants | Create user with two grants
      mariadb_user:
        <<: *mariadb_params
        name: "{{ user_name_1 }}"
        password: "{{ user_password_1 }}"
        update_password: on_create
        priv: '*.*:SELECT,GRANT'

    - name: Revoke only grants | Revoke grant priv from db_user1
      register: result
      mariadb_user:
        <<: *mariadb_params
        name: "{{ user_name_1 }}"
        password: "{{ user_password_1 }}"
        update_password: on_create
        priv: '*.*:SELECT'

    - name: Revoke only grants | Assert that db_user1 only have one priv left
      assert:
        that:
          - result is not failed
          - result is changed

    - name: Revoke only grants | Update db_user1 again to test idempotence
      register: result
      mariadb_user:
        <<: *mariadb_params
        name: "{{ user_name_1 }}"
        password: "{{ user_password_1 }}"
        update_password: on_create
        priv: '*.*:SELECT'

    - name: Revoke only grants | Assert that task is idempotent
      assert:
        that:
          - result is succeeded
          - result is not changed

  always:
    - include_tasks: utils/remove_user.yml
      vars:
        user_name: "{{ user_name_1 }}"
