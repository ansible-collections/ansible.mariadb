---

- name: Utils | Create user {{ user_name }}
  mariadb_user:
    login_user: "{{ mariadb_user }}"
    login_password: "{{ mariadb_password }}"
    login_host: "{{ mariadb_host }}"
    login_port: "{{ mariadb_primary_port }}"
    name: "{{ user_name }}"
    host: "{{ user_host | default(omit) }}"
    password: "{{ user_password }}"
    state: present
