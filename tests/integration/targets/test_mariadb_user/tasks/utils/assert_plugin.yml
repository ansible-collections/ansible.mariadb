---

- name: Utils | Assert plugin | Query for user {{ user_name }}
  ansible.builtin.command: "{{ mariadb_command }} -e \"SELECT plugin FROM mariadb.user where user='{{ user_name }}'\""
  register: result
  changed_when: False

- name: Utils | Assert plugin | Assert plugin is correct
  ansible.builtin.assert:
    that:
      - plugin_type in result.stdout
