---

- vars:
    mariadb_parameters: &mariadb_params
      login_user: '{{ mariadb_user }}'
      login_password: '{{ mariadb_password }}'
      login_host: '{{ mariadb_host }}'
      login_port: '{{ mariadb_primary_port }}'

  block:

    # ========================= Prepare =======================================
    # We use query to prevent our module of changing the case
    - name: MariaDB_user Column case sensitive | Create a test table
      ansible.mariadb.mariadb_query:
        <<: *mariadb_params
        query:
          - CREATE DATABASE mariadb_user_column_case
          - >-
            CREATE TABLE mariadb_user_column_case.t1
            (a int, B int, cC int, Dd int)
          - >-
            INSERT INTO mariadb_user_column_case.t1
            (a, B, cC, Dd) VALUES (1,2,3,4)

    # ================= Reproduce failure =====================================

    - name: MariaDB_user Column case sensitive | Create test user
      ansible.mariadb.mariadb_user:
        <<: *mariadb_params
        name: column_case_sensitive
        host: '%'
        password: 'msandbox'
        priv:
          'mariadb_user_column_case.t1': 'SELECT(a, B, cC, Dd)'
        column_case_sensitive: false

    - name: MariaDB_user Column case sensitive | Assert user privileges are all caps
      ansible.mariadb.mariadb_query:
        <<: *mariadb_params
        query:
          - SHOW GRANTS FOR column_case_sensitive@'%'
      register: column_case_insensitive_grants
      failed_when:
        # Column order may vary, thus test each separately
        - >-
          column_case_insensitive_grants.query_result[0][1]
          is not search("A", ignorecase=false)
          or column_case_insensitive_grants.query_result[0][1]
          is not search("B", ignorecase=false)
          or column_case_insensitive_grants.query_result[0][1]
          is not search("CC", ignorecase=false)
          or column_case_insensitive_grants.query_result[0][1]
          is not search("DD", ignorecase=false)

    - name: MariaDB_user Column case sensitive | Assert 4 column are accessible
      ansible.mariadb.mariadb_query:
        <<: *mariadb_params
        login_user: column_case_sensitive
        query:
          - DESC mariadb_user_column_case.t1
      register: assert_4_col_accessible
      failed_when:
        - assert_4_col_accessible.rowcount[0] | int != 4

    # ======================== Test fix  ======================================

    - name: MariaDB_user Column case sensitive | Create users with case sensitive
      ansible.mariadb.mariadb_user:
        <<: *mariadb_params
        name: column_case_sensitive
        host: '%'
        password: 'msandbox'
        priv:
          'mariadb_user_column_case.t1': 'SELECT(a, B, cC, Dd)'
        column_case_sensitive: true

    - name: MariaDB_user Column case sensitive | Assert user privileges are case sensitive
      ansible.mariadb.mariadb_query:
        <<: *mariadb_params
        query:
          - SHOW GRANTS FOR column_case_sensitive@'%'
      register: column_case_sensitive_grants
      failed_when:
        # Column order may vary, thus test each separately
        - >-
          column_case_sensitive_grants.query_result[0][1]
          is not search("a", ignorecase=false)
          or column_case_sensitive_grants.query_result[0][1]
          is not search("B", ignorecase=false)
          or column_case_sensitive_grants.query_result[0][1]
          is not search("cC", ignorecase=false)
          or column_case_sensitive_grants.query_result[0][1]
          is not search("Dd", ignorecase=false)

    - name: MariaDB_user Column case sensitive | Assert 4 columns are accessible
      ansible.mariadb.mariadb_query:
        <<: *mariadb_params
        login_user: column_case_sensitive
        query:
          - DESC mariadb_user_column_case.t1
      register: assert_4_col_accessible
      failed_when:
        - assert_4_col_accessible.rowcount[0] | int != 4

    # ========================= Teardown ======================================

    - name: MariaDB_user Column case sensitive | Delete test users
      ansible.mariadb.mariadb_user:
        <<: *mariadb_params
        name: column_case_sensitive
        host_all: true
        state: absent

    - name: MariaDB_user Column case sensitive | Delete test database
      ansible.mariadb.mariadb_db:
        <<: *mariadb_params
        name: mariadb_user_column_case
        state: absent
