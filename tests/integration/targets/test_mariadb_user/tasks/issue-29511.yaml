---
- vars:
    mariadb_parameters: &mariadb_params
      login_user: '{{ mariadb_user }}'
      login_password: '{{ mariadb_password }}'
      login_host: '{{ mariadb_host }}'
      login_port: '{{ mariadb_primary_port }}'

  block:

    - name: Issue-29511 | test setup | drop database
      mariadb_db:
        <<: *mariadb_params
        name: "{{ item }}"
        state: absent
      loop:
        - foo
        - bar

    - name: Issue-29511 | test setup | create database
      mariadb_db:
        <<: *mariadb_params
        name: "{{ item }}"
        state: present
      loop:
        - foo
        - bar

    - name: Issue-29511 | Copy SQL scripts to remote
      copy:
        src: "{{ item }}"
        dest: "{{ remote_tmp_dir }}/{{ item | basename }}"
      with_items:
        - create-function.sql
        - create-procedure.sql

    - name: Issue-29511 | Create function for test
      shell: "{{ mariadb_command }} < {{ remote_tmp_dir }}/create-function.sql"

    - name: Issue-29511 | Create procedure for test
      shell: "{{ mariadb_command }} < {{ remote_tmp_dir }}/create-procedure.sql"

    - name: Issue-29511 | Create user with FUNCTION and PROCEDURE privileges
      mariadb_user:
        <<: *mariadb_params
        name: '{{ user_name_2 }}'
        password: '{{ user_password_2 }}'
        state: present
        priv: 'FUNCTION foo.function:EXECUTE/foo.*:SELECT/PROCEDURE bar.procedure:EXECUTE'
      register: result

    - name: Issue-29511 | Assert Create user with FUNCTION and PROCEDURE privileges
      assert:
        that:
          - result is success
          - result is changed

    - name: Issue-29511 | Create user with FUNCTION and PROCEDURE privileges - Idempotent check
      mariadb_user:
        <<: *mariadb_params
        name: '{{ user_name_2 }}'
        password: '{{ user_password_2 }}'
        state: present
        priv: 'FUNCTION foo.function:EXECUTE/foo.*:SELECT/PROCEDURE bar.procedure:EXECUTE'
      register: result

    - name: Issue-29511 | Assert Create user with FUNCTION and PROCEDURE privileges
      assert:
        that:
          - result is success
          - result is not changed

    - name: Issue-29511 | Test teardown | cleanup databases
      mariadb_db:
        <<: *mariadb_params
        name: "{{ item }}"
        state: absent
      loop:
        - foo
        - bar

    - include_tasks: utils/remove_user.yml
      vars:
        user_name: "{{ user_name_2 }}"
