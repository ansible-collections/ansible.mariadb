ancestor: 5.1.0
releases:
  6.0.0:
    changes:
      major_changes:
      - The mysql_clone, mysql_resource_group, and mysql_resource_group_info have
        been removed from the `ansible.mariadb` collection because they do not support
        MariaDB.
      - This `ansible.mariadb` collection only supports MariaDB. Please do NOT use
        this collection for MySQL automation - use the `ansible.mysql` collection
        instead.
      release_summary: 'This is the first release of the `ansible.mariadb` collection.

        This collection was cloned from the `ansible.mysql` collection to allow its
        contributors and maintainers to focus on MariaDB-related automation development.

        MySQL is NOT supported by the `ansible.mariadb` collection.'
    fragments:
    - 0-remove_modules.yml
    - 6.0.0.yml
    release_date: '2026-07-09'
  6.0.1:
    changes:
      release_summary: This is a patch release of the ansible.mariadb collection.
        It only contains fixes of broken links in README.
    fragments:
    - 6.0.1.yml
    release_date: '2026-07-09'
  6.0.2:
    changes:
      release_summary: This is a patch release of the ansible.mariadb collection.
        It only contains documentation fixes.
    fragments:
    - 6.0.2.yml
    release_date: '2026-07-09'
  6.0.3:
    changes:
      bugfixes:
      - mariadb_db - mask login password in ``executed_commands`` return value to
        prevent credential leakage in registered variables.
      - mariadb_replication - mask primary password in ``executed_queries`` return
        value to prevent credential leakage in registered variables.
      - mariadb_user - handle updating existing users when the password_lifetime attribute
        is missing from mysql.global_priv.priv
      release_summary: 'This is a patch release of the ``ansible.mariadb`` collection.

        This changelog contains all changes to the modules and plugins in this collection

        that have been made after the previous release.'
    fragments:
    - 6.0.3.yml
    - mariadb-user-missing-password-lifetime.yaml
    - mask-passwords-in-return-values.yaml
    release_date: '2026-11-13'
